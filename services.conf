# Services for bin/svc and the menubar (menubar/svc.10s.sh).
# name | dir | url | command        '-' = no url, '---' = menu separator
# Commands run via `mise exec` in dir, so each workspace's pinned tools are on PATH.
# Boards get fixed ports here (not the workspaces' default 6420) so several can run at once.

awake           | ~                    | -                     | caffeinate -di
---
board-ctrl      | ~/workspaces/ctrl     | http://127.0.0.1:6421 | backlog browser --no-open -p 6421
board-hookdeck  | ~/workspaces/hookdeck | http://127.0.0.1:6422 | backlog browser --no-open -p 6422
board-cs        | ~/workspaces/cs       | http://127.0.0.1:6423 | backlog browser --no-open -p 6423
board-enable    | ~/workspaces/enable   | http://127.0.0.1:6424 | backlog browser --no-open -p 6424
board-solex     | ~/workspaces/solex    | http://127.0.0.1:6425 | backlog browser --no-open -p 6425
---
tunnel-hd-prd   | ~                    | -                     | ssh -N -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 hd_jumpbox
tunnel-hd-stg   | ~                    | -                     | ssh -N -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 hd_jumpbox_stg
