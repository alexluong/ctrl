# Services for bin/svc and the menubar (menubar/svc.10s.sh).
# [group]                           a workspace; its services are named <group>-<name> (svc start hookdeck-board)
# name | dir | url | command        '-' = no url
# Commands run via `mise exec` in dir, so each workspace's pinned tools are on PATH.
# dir '<ssh host>:<dir>' = the service runs on that host and keeps running with this Mac asleep or away;
# the menubar item is a switch for it (group it under the host's name).
# Boards get fixed ports here (not the workspaces' default 6420) so several can run at once.

caffeinate | ~ | - | caffeinate -d

[hookdeck]
board      | ~/workspaces/hookdeck | http://127.0.0.1:6422 | backlog browser --no-open -p 6422
tunnel-prd | ~                     | -                     | ssh -N -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 hd_jumpbox
tunnel-stg | ~                     | -                     | ssh -N -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 hd_jumpbox_stg

[hookdeck-ws]
tunnel-prd | hookdeck-ws:~ | - | ssh -N -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 hd_jumpbox
tunnel-stg | hookdeck-ws:~ | - | ssh -N -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 hd_jumpbox_stg
test       | hookdeck-ws:~ | - | sleep 300
bad        | hookdeck-ws:~ | - | false
gone       | nohost.invalid:~ | - | sleep 1

[enable]
board      | ~/workspaces/enable   | http://127.0.0.1:6424 | backlog browser --no-open -p 6424

[ctrl]
board      | ~/workspaces/ctrl     | http://127.0.0.1:6421 | backlog browser --no-open -p 6421

[cs]
board      | ~/workspaces/cs       | http://127.0.0.1:6423 | backlog browser --no-open -p 6423

[solex]
board      | ~/workspaces/solex    | http://127.0.0.1:6425 | backlog browser --no-open -p 6425
