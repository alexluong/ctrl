# ON-DEMAND stack (~155 MB). Do NOT leave running — the VM is RAM-tight.
# Start only when streaming:  ./scripts/up.sh jellyfin   then  down.sh jellyfin
# Always-on set is: download + private + calibre + audiobookshelf (see README).
services:
  jellyfin:
    image: linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATA_PATH}/jellyfin:/config
      - /Volumes/Blue4/arr:/Blue4
      - /Volumes/Red4/arr:/Red4
    ports:
      - 8096:8096
    restart: unless-stopped
