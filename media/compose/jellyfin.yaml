# ALWAYS-ON stack (~155 MB, more while scanning/transcoding). Remote streaming
# server — must be reachable anytime, so it stays resident (VM is 8 GB / 6 CPU).
# Access + client notes: see media/jellyfin.md. Part of `./scripts/up.sh core`.
services:
  jellyfin:
    image: linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      # /config lives on a NATIVE docker volume, not the virtiofs-mounted drive
      # (same fix as qbittorrent — see compose/download.yaml). The Jellyfin
      # SQLite DB can't get reliable locks on virtiofs: under scan/metadata write
      # load it throws "database is locked" storms and startup itself can wedge
      # on the DB. Migrated with:
      #   docker volume create jellyfin_config
      #   docker run --rm -v jellyfin_config:/dest -v ${DATA_PATH}/jellyfin:/src:ro \
      #     alpine cp -a /src/. /dest/
      # The old ${DATA_PATH}/jellyfin copy stays on the drive as a backup.
      - jellyfin_config:/config
      - /Volumes/Blue4/arr:/Blue4
      - /Volumes/Red4/arr:/Red4
    ports:
      - 8096:8096
    restart: unless-stopped

volumes:
  # Native volume for Jellyfin config/DB (see jellyfin service above for why).
  # Created/populated out-of-band, so marked external.
  jellyfin_config:
    external: true
